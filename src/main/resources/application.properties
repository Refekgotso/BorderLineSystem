# Application
spring.application.name=BorderLine

# Server
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/borderline_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Akhuyolo@14
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySuperSecretKeyForJWTAuthentication1234567890
jwt.expiration=86400000

# CORS
cors.allowed.origins=http://localhost:5173

# Logging
logging.level.com.BorderLineSystem=DEBUG
logging.level.org.springframework.security=DEBUG

# ===== SWAGGER CONFIGURATION =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false
springdoc.packages-to-scan=com.BorderLineSystem.BorderLine.controller
springdoc.swagger-ui.disable-swagger-default-url=true
